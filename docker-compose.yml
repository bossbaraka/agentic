# ═══════════════════════════════════════════════════════════════
#  التشغيل:   docker compose up -d
#  السجلات:   docker compose logs -f
#  الإيقاف:   docker compose down
# ═══════════════════════════════════════════════════════════════

services:
  bot:
    build: .
    container_name: mureeh-agent
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      MEDIA_DIR: /app/data/media
      KNOWLEDGE_DIR: /app/knowledge
    volumes:
      # ⚠️ مهم: يحفظ المحادثات والوسائط بين عمليات النشر
      - bot-data:/app/data
      # قاعدة المعرفة قابلة للتعديل من المضيف دون إعادة بناء
      - ./knowledge:/app/knowledge:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  bot-data:
