services:
  - type: web
    name: mureeh-ai-agent
    env: node
    # Node 22 مطلوب لقاعدة البيانات المدمجة node:sqlite
    nodeVersion: 22.11.0
    region: singapore
    plan: free
    # ⚠️ باقة Render المجانية بلا قرص دائم: تُفقد قاعدة SQLite عند كل نشر.
    # على باقة مدفوعة أضف disk: { name: data, mountPath: /app/data, sizeGB: 1 }
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: BOT_MODE
        value: business
      - key: WHATSAPP_ENABLED
        value: true
      - key: KEEP_ALIVE_ENABLED
        value: true
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: 10
      - key: WHATSAPP_MANAGER_NUMBER
        value: "97059349809"
      - key: HUMAN_AGENT_ID
        value: "97059349809"
      - key: TELEGRAM_MANAGER_PHONE
        value: "+972599891559"
